name: Scrape Stream URLs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of URLs to scrape this run (1 to any, default 1000)"
        required: false
        default: "1000"

      use_custom_set:
        description: |
          Use custom_url_extract_set.txt?
          yes → ONLY scrape URLs generated from that file. Bulk list is ignored entirely.
          no  → ignore the custom set file and scrape the bulk list as normal.
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      custom_set_file:
        description: |
          Path (in the repo) to the custom URL set file.
          Only used when use_custom_set = yes.
          Default: custom_url_extract_set.txt
        required: false
        default: "custom_url_extract_set.txt"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -sf http://localhost:8191/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8191/health; then
              echo "FlareSolverr ready."
              break
            fi
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done

      # ── Validate custom set file (only when use_custom_set = yes) ──────────
      # Fails fast with a clear error if the file is missing from the repo,
      # before any scraping time is wasted.
      - name: Validate custom URL set file
        if: ${{ github.event.inputs.use_custom_set == 'yes' }}
        run: |
          FILE="${{ github.event.inputs.custom_set_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Custom set file not found in repo: $FILE"
            echo "Create the file, commit it, then re-run with use_custom_set=yes."
            exit 1
          fi
          echo "Custom set file found: $FILE"
          echo "--- Preview (first 20 lines) ---"
          head -n 20 "$FILE"
          echo "--- Total non-blank, non-comment lines ---"
          grep -cvE '^\s*(#|$)' "$FILE" || true

      # ── Download bulk URL list ─────────────────────────────────────────────
      # Downloaded unconditionally so the file always exists on disk.
      # When use_custom_set=yes the scraper sets CUSTOM_SET_ONLY=true and
      # never reads this file — the download cost is negligible (~1 s).
      - name: Download bulk URL list
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/donkarboy/anihq_firesolver/refs/heads/main/anihq2%20(1).json" \
            -o anihq2.txt
          echo "Lines in bulk URL list: $(wc -l < anihq2.txt)"

      # ── Run scraper ────────────────────────────────────────────────────────
      # CUSTOM_SET_FILE  — path to the set file, or empty when use_custom_set=no
      # CUSTOM_SET_ONLY  — automatically "true" whenever CUSTOM_SET_FILE is set,
      #                    so the bulk list is NEVER mixed in on a custom run.
      - name: Run scraper
        env:
          URL_LIST_FILE: anihq2.txt
          LIMIT: ${{ github.event.inputs.limit }}
          CUSTOM_SET_FILE: ${{ github.event.inputs.use_custom_set == 'yes' && github.event.inputs.custom_set_file || '' }}
          CUSTOM_SET_ONLY: ${{ github.event.inputs.use_custom_set == 'yes' && 'true' || 'false' }}
        run: python scraper.py

      # ── Commit all results ─────────────────────────────────────────────────
      - name: Commit all results to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add media_stream.json              2>/dev/null || true
          git add media_stream.json.*            2>/dev/null || true
          git add no_media_found.txt             2>/dev/null || true
          git add no_media_found.txt.*           2>/dev/null || true
          git add media_found.txt                2>/dev/null || true
          git add media_found.txt.*              2>/dev/null || true
          git add already_processed_urls.txt     2>/dev/null || true
          git add already_processed_urls.txt.*   2>/dev/null || true

          if [ "${{ github.event.inputs.use_custom_set }}" = "yes" ]; then
            MODE="custom-only(${{ github.event.inputs.custom_set_file }})"
          else
            MODE="bulk"
          fi

          git diff --cached --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: scrape run — mode=$MODE limit=${{ github.event.inputs.limit }}"
          git push
