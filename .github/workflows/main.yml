name: Scrape Stream URLs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of URLs to scrape this run (1 to any, default 1000)"
        required: false
        default: "1000"

      use_custom_set:
        description: |
          Use custom_url_extract_set.txt to generate URLs?
          yes  → parse the custom set file and scrape those URLs first (or only)
          no   → ignore the custom set file entirely
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      custom_set_file:
        description: |
          Path (in the repo) to the custom URL set file.
          Only used when use_custom_set = yes.
          Default: custom_url_extract_set.txt
        required: false
        default: "custom_url_extract_set.txt"

      custom_set_only:
        description: |
          When yes: scrape ONLY the URLs generated from the custom set file.
                    The bulk URL list (anihq2.txt) is skipped entirely.
          When no:  scrape custom-set URLs first, then continue with bulk list.
          Only used when use_custom_set = yes.
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -sf http://localhost:8191/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8191/health; then
              echo "FlareSolverr ready."
              break
            fi
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done

      # ── Custom set validation ──────────────────────────────────────────────
      # Runs only when use_custom_set = yes.
      # Checks that the file exists in the repo and prints a preview.
      - name: Validate custom URL set file
        if: ${{ github.event.inputs.use_custom_set == 'yes' }}
        run: |
          FILE="${{ github.event.inputs.custom_set_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Custom set file not found in repo: $FILE"
            echo "Create the file and commit it before running with use_custom_set=yes."
            exit 1
          fi
          echo "Custom set file found: $FILE"
          echo "--- Preview (first 20 lines) ---"
          head -n 20 "$FILE"
          echo "--- Total non-blank lines ---"
          grep -c '[^[:space:]]' "$FILE" || true

      # ── Bulk URL list download ─────────────────────────────────────────────
      # Always downloaded so the scraper can fall back to it when
      # use_custom_set=no or custom_set_only=no.
      - name: Download bulk URL list
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/donkarboy/anihq_firesolver/refs/heads/main/anihq2%20(1).json" \
            -o anihq2.txt
          echo "Lines in bulk URL list: $(wc -l < anihq2.txt)"

      # ── Run scraper ────────────────────────────────────────────────────────
      # Environment variables control which mode the scraper runs in:
      #
      #   CUSTOM_SET_FILE   – path to the custom set file (empty = disabled)
      #   CUSTOM_SET_ONLY   – true/false; skip bulk list when true
      #
      # When use_custom_set = no, CUSTOM_SET_FILE is left empty so the scraper
      # ignores custom-set logic entirely and behaves like before.
      - name: Run scraper
        env:
          URL_LIST_FILE: anihq2.txt
          LIMIT: ${{ github.event.inputs.limit }}
          CUSTOM_SET_FILE: >-
            ${{
              github.event.inputs.use_custom_set == 'yes'
              && github.event.inputs.custom_set_file
              || ''
            }}
          CUSTOM_SET_ONLY: >-
            ${{
              github.event.inputs.use_custom_set == 'yes'
              && github.event.inputs.custom_set_only
              || 'false'
            }}
        run: python scraper.py

      # ── Commit all results ────────────────────────────────────────────────
      - name: Commit all results to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage main output + any rotated splits (.1 .2 .3 …)
          git add media_stream.json              2>/dev/null || true
          git add media_stream.json.*            2>/dev/null || true
          git add no_media_found.txt             2>/dev/null || true
          git add no_media_found.txt.*           2>/dev/null || true
          git add media_found.txt                2>/dev/null || true
          git add media_found.txt.*              2>/dev/null || true
          git add already_processed_urls.txt     2>/dev/null || true
          git add already_processed_urls.txt.*   2>/dev/null || true

          # Build a descriptive commit message showing which mode ran
          MODE="bulk"
          if [ "${{ github.event.inputs.use_custom_set }}" = "yes" ]; then
            if [ "${{ github.event.inputs.custom_set_only }}" = "yes" ]; then
              MODE="custom-only(${{ github.event.inputs.custom_set_file }})"
            else
              MODE="custom+bulk(${{ github.event.inputs.custom_set_file }})"
            fi
          fi

          git diff --cached --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: scrape run — mode=$MODE limit=${{ github.event.inputs.limit }}"
          git push
