name: Scrape Stream URLs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of URLs to scrape this run (1 to any, default 1000)"
        required: false
        default: "1000"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
        options: >-
          --health-cmd "curl -sf http://localhost:8191/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8191/health; then
              echo "FlareSolverr ready."
              break
            fi
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done

      - name: Download URL list
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/donkarboy/anihq_firesolver/refs/heads/main/anihq2%20(1).json" \
            -o anihq2.txt
          echo "Lines in URL list: $(wc -l < anihq2.txt)"

      - name: Run scraper
        env:
          URL_LIST_FILE: anihq2.txt
          LIMIT:         ${{ github.event.inputs.limit }}
        run: python scraper.py

      - name: Commit all results to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage main output + any rotated splits (.1 .2 .3 …)
          git add media_stream.json              2>/dev/null || true
          git add media_stream.json.*            2>/dev/null || true
          git add no_media_found.txt             2>/dev/null || true
          git add no_media_found.txt.*           2>/dev/null || true
          git add media_found.txt                2>/dev/null || true
          git add media_found.txt.*              2>/dev/null || true
          git add already_processed_urls.txt     2>/dev/null || true
          git add already_processed_urls.txt.*   2>/dev/null || true

          git diff --cached --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: scrape run — limit=${{ github.event.inputs.limit }}"
          git push
